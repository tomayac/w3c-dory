<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>W3C Dory</title>
    <link rel="icon" href="icons/icon-32.png" />
    <link rel="stylesheet" href="options.css" />
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-128.png" alt="" width="96" height="96" />
        <h1>W3C Dory</h1>
      </header>

      <section>
        <h2>Session</h2>
        <dl id="status"></dl>
        <button id="renew" type="button">Log in again now</button>
      </section>

      <section>
        <h2>Credentials</h2>
        <p>
          W3C sessions end 28 days after login, and the server never extends
          them. To keep you logged in, the extension logs in again a week before
          that, which needs your W3C username and password. The password is
          encrypted with a key that never leaves this browser profile.
        </p>
        <p id="stored"></p>
        <form id="credentials">
          <label>
            Username
            <input name="username" autocomplete="username" required />
          </label>
          <label>
            Password
            <input
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button type="submit">Save</button>
          <button id="forget" type="button">Forget</button>
        </form>
        <label class="checkbox">
          <input id="capture" type="checkbox" />
          Save what I type on the W3C login page
        </label>
      </section>
    </main>
  </body>
</html>
